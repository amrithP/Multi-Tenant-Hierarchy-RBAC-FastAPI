version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: "Pr@1407rs"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "hierarchy_db"
    ports:
      - "3366:3306"  #computer port to db container port in docker 
    volumes:
      - mysql_data:/var/lib/mysql    # db data is  stored in docker volume .If in case , it gets deleted or modifies , the db data persists
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi_app:
    build: .
    container_name: fastapi_app
    depends_on:
      db:
        condition: service_healthy  #container created only when db container is healthy
    ports:
      - "8000:8000"    #computer port to fastapi container port 
    environment:
      - MYSQL_HOST =db
      - MYSQL_PORT =3306
      - MYSQL_USER =root
      - MYSQL_PASSWORD =Pr@1407rs  #mysql user is root so maintain the same password as above 
      - MYSQL_DATABASE =hierarchy_db

volumes:
  mysql_data