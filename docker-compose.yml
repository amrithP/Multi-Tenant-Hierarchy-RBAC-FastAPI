version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: "Pr@1407rs"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "hierarchy_db"
    ports:
      - "3366:3306"  #computer port to db container port in docker 
    volumes:
      - mysql_data:/var/lib/mysql    # db data is  stored in docker volume .If in case , it gets deleted or modifies , the db data persists
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi_app:
    build: .   #build everything
    container_name: fastapi_app
    depends_on:
      db:
        condition: service_healthy  
    ports:
      - "8000:8000"    #computer port to fastapi container port 
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=hierarchy_db
      - VALID_CLIENT_ID=${VALID_CLIENT_ID}
      - VALID_CLIENT_SECRET=${VALID_CLIENT_SECRET}
volumes:
  mysql_data: